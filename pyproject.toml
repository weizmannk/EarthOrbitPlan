[project]
name = "EarthOrbitPlan"
dynamic = ["version"]
authors = [{name = "Ramodgwendé Weizmann Kiendrébéogo", email = "kiend.weizman7@gmail.com"}]
license = "BSD-3-Clause"
description = "Educational Framework for Multimessenger Observing Scenarios"
readme = "README.rst"
requires-python = ">=3.12, <3.15"
dependencies = [
    # Python floor tracks m4opt (>=3.12 since m4opt v2.13).
    "m4opt",
    "pandas",
    "joblib",
    "dask",
    "dask-jobqueue",
    "memory-profiler",
    "igwn-ligolw",
]

#
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Educational :: Astronomy",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = [
    "astroplan",
    "networkx",
    "pytest-astropy",
]
dev = [
    "pre-commit",
    "EarthOrbitPlan[test]",
]
docs = [
    "pysiaf",
    "sphinx-astropy[confv2]",
    "sphinxcontrib-bibtex",
    "sphinxcontrib-typer",
    "sphinx-automodapi",
    "sphinx-thebe",
    "sphinx-design",
    "jupyter-sphinx",
    "ipykernel",
    "nbsphinx",
    "sphinx-gallery",
    "ipython",
    "ipykernel",
    "jupyter_client",
    "nbconvert",
    "sphinx",
    "numpydoc",
    "graphviz",
    "joblib",
    "dask",
    "ligo.skymap >= 2.4.0",
    "python-ligo-lw",
    "igwn-ligolw",
    "memory-profiler"
]

[project.urls]
Homepage  = "https://EarthOrbitPlan.readthedocs.io"
"Bug Tracker" = "https://github.com/weizmannk/EarthOrbitPlan/issues"
"Change Log" = "https://EarthOrbitPlan.readthedocs.io/en/latest/changes.html"
"Documentation" = "https://EarthOrbitPlan.readthedocs.io/"
"GitHub" = "https://github.com/weizmannk/EarthOrbitPlan"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = [
    "py.typed",
    "*.txt",
    "*.ecsv",
    "*.xml",
    "*.h5",
    "*.ini",
]
[tool.pytest.ini_options]
testpaths = [
    "tests",
]
norecursedirs = [
    "_build",
]
astropy_header = true
doctest_optionflags = [
    "FLOAT_CMP",
    "IGNORE_EXCEPTION_DETAIL",
]

[tool.coverage.run]
omit = [
    "*/earthorbitplan/_version*",
]

[tool.coverage.report]
exclude_also = [
    # Don't complain about packages we have installed
    "except ImportError",
    # Don't complain if tests don't hit assertions
    "raise AssertionError",
    "raise NotImplementedError",
    # Don't complain about script hooks
    "def main\\(.*\\):",
    # Ignore branches that don't pertain to this version of Python
    "pragma: py{ignore_python_version}",
    # Don't complain about IPython completion helper
    "def _ipython_key_completions_",
]


[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/earthorbitplan/_version.py"

[tool.mypy]
exclude = ["^docs/"]
ignore_missing_imports = true

[tool.codespell]
ignore-words-list = """
    aas,
    sav,
    ser,
    ToO,
    ToOs,
"""

# params_scenarios.ini -- Configuration file for zenodo_downloader.py and unpacker.py

[params]

# === Download Observing scenario from Zenodo ==
# Concept DOIs (resolve to the latest version):
#   fullpop  -> 22550047   pixelpop -> 22555948
permanent_doi = 22550047
file_name     = runs.zip

# === Observing Scenarios GW ===
# Run labels are the folder names inside <subdir>/ (the detector network is
# already baked in, e.g. IR1HL, IR1HLV), so `detectors` stays empty.
zip           = ./runs.zip
subdir        = runs
pop           = fullpop
runs          = IR1HL IR1HLV O5a O5b O5c
detectors     =
mass_threshold = 3.0

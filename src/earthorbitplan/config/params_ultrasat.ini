# =============================================================================
# params_ultrasat.ini
#
# Configuration file for m4opt-scheduler.py
# Supports three execution backends: condor | parallel | dask
#
# ULTRASAT SKY GRID VARIANTS:
#   - allsky      : full-sky coverage -->  data_dir = ultrasat-allsky
#   - non-overlap : tiled no-overlap  -->  data_dir = ultrasat-non-overlap
#
# To switch variants, change [mission] skygrid and [paths] data_dir together.
# =============================================================================


# =============================================================================
[download]
# Zenodo observing-scenario archive
# =============================================================================

permanent_doi = 22550047
file_name     = runs.zip


# =============================================================================
[scenarios]
# Gravitational-wave observing runs to process
# =============================================================================

zip            = ./runs.zip
subdir         = runs
runs           = O5a-HL O5a-HLV O5b-HLV O5c-HLV
mass_threshold = 3.0


# =============================================================================
[paths]
# All directories are relative to data_dir unless absolute paths are given
#
# Set data_dir to match the active skygrid variant:
#   allsky     --> ultrasat-allsky
#   non-overlap--> ultrasat-non-overlap
# =============================================================================

data_dir    = ultrasat-non-overlap   # <- switch to "ultrasat-allsky" for allsky run
skymap_dir  = skymaps                # input  : sky maps      (.fits)
sched_dir   = schedules              # output : schedules     (.ecsv)
log_dir     = logs                   # output : HTCondor logs (stdout / stderr)
prog_dir    = progress               # output : progress files

event_table = observing-scenarios.ecsv   # must contain column "coinc_event_id"


# =============================================================================
[mission]
# Telescope and bandpass configuration
# =============================================================================

mission  = ultrasat
bandpass = NUV        # uvex: FUV | NUV   ultrasat: NUV   ztf: ztfg | ztfr | ztfi
nside    = 128        # HEALPix resolution -- must be a power of 2

# Sky grid variant -- must match data_dir above:
#   allsky      : full-sky tiling
#   non-overlap : non-overlapping tiling
skygrid  = non-overlap


# =============================================================================
[kilonova]
# Kilonova absolute magnitude prior (AB system)
# =============================================================================

absmag_mean  = -16.0
absmag_stdev =   1.3


# =============================================================================
[scheduling]
# Timing, SNR, and exposure constraints
# =============================================================================

snr          = 10
delay        = 15min      # time between GW alert and start of observations
deadline     = 6hour      # hard cutoff after alert

exptime_min  = 300        # seconds
exptime_max  = inf        # seconds -- set to inf for unconstrained

# m4opt schedule knobs. Any blank/removed line -> flag omitted, m4opt default used.
visits       = 2          # observations per field
cadence      = 30min      # minimum separation between visits
appmag_dist  = true       # variable exposure with an absolute-magnitude distribution
# max_fields left unset: ULTRASAT's 204 deg^2 FoV + 6 h deadline never reach the
# cap, so it does not matter here. Set an integer to force it.
max_fields   =


# =============================================================================
[solver]
# MILP solver resource limits
# =============================================================================

timelimit = 2hour
memory    = 10GiB
jobs      = 0             # threads per solve  (0 = use all available cores)


# =============================================================================
[execution]
# Backend: condor | parallel | dask
# =============================================================================

backend = condor
n_cores = 10              # used only in parallel mode; ignored by condor


# =============================================================================
[postprocessing]
# Statistical aggregation (postprocess.py)
#
# output_file must match the active skygrid variant:
#   allsky     --> ultrasat_allsky.ecsv
#   non-overlap--> ultrasat_non_overlap.ecsv
# =============================================================================

output_file = ultrasat_non_overlap.ecsv   # <- switch to "ultrasat_allsky.ecsv" for allsky run
